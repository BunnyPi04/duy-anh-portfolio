<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>自己紹介サイト</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    </head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('../images/2.jpg');
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .image {
            overflow: hidden;
            background-image: url('images/image_1.jpg');
            width: 50%;
            height: 100%;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            float: left;
        }
        .container {
            width: 50%;
            height: 100%;
            display: inline-block;
            color: #333;
            float: left;
        }
        .menu {
            padding: 24px;
        }

        .menu-item {
            float: right;
            padding: 8px 16px;
        }

        .menu-item:hover {
            background-color: #CADABF;
        }

        .menu-item a {
            color: #333;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .title {
            font-size: 80px;
            font-weight: bold;
            margin-top: 20%;
            margin-left: 15%;
            line-height: 1;
            font-family: "Kosugi Maru", sans-serif;
        }

        .text {
            margin-left: 15%;
            margin-top: 24px;
            line-height: 1;
            font-size: 20px;
        }

        .intro {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .footer {
            margin-left: 15%;
            margin-top: 15%;
            display: inline-block;
            background-color: #ECDFCC;
            border-radius: 10px;
        }

        .footer img {
            width: 220px;
            height: auto;
            border-radius: 8px;
            float: left;
            padding: 16px;
        }
        .image-text {
            float: left;
            margin-left: 16px;
        }

        .image-text p {
            font-size: 20px;
        }
    </style>
    <body>
        <div class="menu">
            <div class="menu-item">
                <a href="/">ホーム</a>
            </div>
            <div class="menu-item">
                <a href="/shumi/shumi.html">趣味</a>
            </div>
            <div class="menu-item">
                <a href="/profile/index.html">プロフィール</a>
            </div>
        </div>
        <h1 class="left">
            <div class="avatar">
                <img src="../images/profile.jpg" alt="Avatar" style="width: 400px; height: auto; border-radius: 500px;">
            </div>
        </h1>
        <div class="text">
        </div>
    </body>
</html>
