<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>自己紹介サイト</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">
    </head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('../images/Home.jpg');
            width: 100%;
            height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .container {
            width: 100%;
            display: inline-block;
            color: #333;
        }

        .left {
            width: 50%;
            display: inline-block;
            text-align: center;
            float: left;
        }
        .right {
            width: 50%;
            display: inline-block;
            text-align: center;
        }
        .menu {
            background-color: #ECDFCC;
            display: inline-block;
            width: 100%;
            padding-top: 24px;
            padding-bottom: 24px;
            border-bottom: 1px solid #333;
        }

        .menu-item {
            float: right;
            padding: 8px 16px;
        }

        .menu-item:hover {
            background-color: #CADABF;
        }

        .menu-item a {
            color: #333;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }

        .title {
            font-size: 60px;
            font-weight: bold;
            line-height: 1.2;
            font-family: "Kosugi Maru", sans-serif;
            text-align: right;
            display: inline-block;
            color: #070707;
        }

        .sub-title {
            text-align: left;
            display: inline-block;
            color: #dbdbdb;
            margin-left: 24px;
            margin-right: 80px;
            font-size: 47px;
        }

        .text {
            margin-top: 24px;
            line-height: 1;
            font-size: 20px;
            text-align: center;
        }

        .intro {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .footer {
            margin-left: 15%;
            margin-top: 15%;
            display: inline-block;
            background-color: #ECDFCC;
            border-radius: 10px;
        }

        .footer img {
            width: 220px;
            height: auto;
            border-radius: 8px;
            float: left;
            padding: 16px;
        }
        .image-text {
            float: left;
            margin-left: 16px;
        }

        .image-text p {
            font-size: 20px;
        }

        .avatar {
            width: 300px;
            height: 300px;
            border-radius: 500px;
            overflow: hidden;
            margin: 0 auto;
            margin-top: 32px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
        }

        .content {
            background-color: #CADABF;
            margin: 32px;
            min-height: 700px;
        }

        table {
            text-align: left;
            margin-left: 32px;
            font-size: 20px;
            line-height: 1.5;
            margin-top: 32px;
            margin-right: 32px;
        }

        table img {
            height: 200px;
        }

        table th {
            padding-right: 32px;
        }

        .page-name {
            text-align: center;
            padding-top: 300px;
            font-size: 80px;
            font-weight: bold;
            font-family: "Kosugi Maru", sans-serif;
        }
    </style>
    <body>
        <div class="menu">
            <div class="menu-item">
                <a href="/index.html">趣味</a>
            </div>
            <div class="menu-item">
                <a href="../profile/index.html">プロフィール</a>
            </div>
            <div class="menu-item">
                <a href="../index.html">ホーム</a>
            </div>
        </div>
        <section class="container">
            <div class="left">
                <div class="content">
                    <div class="page-name">趣味</div>
                </div>
            </div>
            <div class="right">
                <table>
                    <tr>
                        <th>
                            <img src="travel.jpg" alt="よさこい" class="flag">
                        </th>
                        <td><strong>旅行すること</strong></td>
                    </tr>
                    <tr>
                        <th>
                            <img src="yosakoi.jpg" alt="よさこい" class="flag">
                        </th>
                        <td><strong>よさこい</strong>は日本の伝統的な踊りを現代風にアレンジしたもので、活気がありとても楽しいです。</td>
                    </tr>
                    <tr>
                        <th>
                            <img src="vinyl.jpg" alt="よさこい" class="flag">
                        </th>
                        <td>様々なジャンルの<strong>音楽を聴く</strong>を聴くのが好きで、特にポップスやJ-POPが好きです。</td>
                    </tr>
                </table>
            </div>
        </section>
    </body>
</html>
